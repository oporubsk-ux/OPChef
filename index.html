<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E0C0A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPChef">
<title>OPChef – Fitness kuchařka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=Archivo+Expanded:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0C0A;
  --card:#1A1613;
  --card2:#241E19;
  --line:#332A22;
  --orange:#FF6B1A;
  --orange2:#FFA25C;
  --ember:#B33E00;
  --text:#F2EDE7;
  --muted:#9C8F82;
  --green:#6BC46B;
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,sans-serif;font-size:16px;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:92px}

/* ===== HLAVIČKA / LOGO ===== */
header{padding:22px 18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo-ico{width:56px;height:56px}
.logo{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:900;font-size:27px;letter-spacing:-0.5px;color:#fff}
.logo span{color:var(--orange)}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase}

/* ===== KATEGORIE ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.chip.on{background:var(--orange);color:#140A02;border-color:var(--orange)}

/* ===== KARTY ===== */
.list{padding:0 18px;display:flex;flex-direction:column;gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;position:relative;transition:transform .1s}
.rcard:active{transform:scale(.98)}
.rcard .emoji{font-size:30px;margin-bottom:8px;display:block}
.rcard h3{font-size:17px;font-weight:700;line-height:1.25;padding-right:36px}
.rcard .meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--card2);padding:4px 10px;border-radius:8px}
.tag.kcal{color:var(--orange2)}
.fav-btn{position:absolute;top:14px;right:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--line);transition:color .15s;line-height:1}
.fav-btn.on{color:var(--orange)}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:15px;line-height:1.6}

/* ===== DETAIL ===== */
.detail{padding:0 18px}
.back{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;font-family:inherit}
.d-head .emoji{font-size:42px}
.d-head h2{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:900;font-size:23px;line-height:1.2;margin:8px 0}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.mbox b{display:block;font-size:17px;color:var(--orange2)}
.mbox small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.porce{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.porce span{font-weight:700;font-size:15px}
.p-ctrl{display:flex;align-items:center;gap:10px}
.p-btn{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--orange);font-size:20px;font-weight:700;cursor:pointer;font-family:inherit}
.p-num{font-size:20px;font-weight:900;min-width:24px;text-align:center}
.sec-title{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--orange);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}
.ing{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.ing .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:#140A02;transition:all .15s}
.ing.done .chk{background:var(--green);border-color:var(--green)}
.ing.done .i-name{text-decoration:line-through;color:var(--muted)}
.i-name{flex:1;font-size:15px}
.i-mn{font-weight:700;color:var(--orange2);font-size:15px;white-space:nowrap}
.btn{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;margin-top:10px}
.btn.primary{background:var(--orange);color:#140A02}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.krok{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;gap:14px}
.k-num{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:900;font-size:20px;color:var(--orange);flex:0 0 28px;line-height:1.3}
.k-body{flex:1}
.k-title{font-weight:700;font-size:15px;margin-bottom:4px}
.k-text{font-size:14px;line-height:1.55;color:#CFC6BC}
.mt-wrap{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt-adj{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--orange);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.k-timer{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--ember);border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px;color:var(--orange2);cursor:pointer;font-family:inherit}
.k-timer.run{background:var(--ember);color:#fff;border-color:var(--orange)}
textarea.note{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:14px;padding:12px;min-height:80px;resize:vertical}

/* ===== COOKING MODE ===== */
#cook{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;padding:20px;max-width:520px;margin:0 auto}
#cook.on{display:flex}
.c-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.c-prog{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:1px}
.c-close{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600}
.c-bar{height:4px;background:var(--card);border-radius:99px;margin-bottom:22px;overflow:hidden}
.c-bar i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .3s}
.c-mid{flex:1;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.c-title{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:900;font-size:23px;color:var(--orange);margin-bottom:12px}
.c-text{font-size:20px;line-height:1.5;font-weight:500}
.c-ring-wrap{display:flex;flex-direction:column;align-items:center;margin:22px 0 8px}
.c-ring{position:relative;width:185px;height:185px}
.c-ring svg{transform:rotate(-90deg)}
.c-ring .t-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-num b{font-family:'Archivo Expanded','Archivo',sans-serif;font-size:38px;font-weight:900}
.t-num small{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.c-ring.done .t-num b{color:var(--green)}
.t-adj-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.t-adj{width:auto;padding:0 16px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--orange);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.t-btns{display:flex;gap:10px;margin-top:12px}
.t-btn{padding:12px 22px;border-radius:12px;border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.t-btn.start{background:var(--orange);color:#140A02}
.t-btn.reset{background:var(--card);color:var(--text);border:1px solid var(--line)}
.c-nav{display:flex;gap:10px;margin-top:14px}
.c-nav button{flex:1;padding:16px;border-radius:14px;border:none;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.c-prev{background:var(--card);color:var(--text);border:1px solid var(--line)!important}
.c-next{background:var(--orange);color:#140A02}

/* ===== NÁKUP ===== */
.shop-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.shop-item .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:#140A02}
.shop-item.done .chk{background:var(--green);border-color:var(--green)}
.shop-item.done span{text-decoration:line-through;color:var(--muted)}
.shop-item span{flex:1;font-size:15px}
.shop-item small{color:var(--orange2);font-weight:700}

/* ===== FORMULÁŘ ===== */
.f-group{margin-bottom:14px}
.f-group label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.f-group input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:inherit;font-size:15px;padding:12px}
.f-row{display:flex;gap:8px;margin-bottom:8px}
.f-row input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:10px}
.f-row .mini{flex:0 0 70px}
.f-row .del{flex:0 0 42px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:#E05B5B;font-size:17px;cursor:pointer}
.add-line{background:none;border:1px dashed var(--line);border-radius:10px;color:var(--muted);width:100%;padding:10px;font-family:inherit;font-size:14px;cursor:pointer;margin-bottom:14px}

/* ===== MĚSÍČNÍ KALENDÁŘ ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-bottom:10px}
.cal-head b{font-family:'Archivo Expanded','Archivo',sans-serif;font-size:18px;text-transform:capitalize}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--orange);font-size:18px;font-weight:800;cursor:pointer;font-family:inherit}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 18px;margin-bottom:16px}
.cal-wd{text-align:center;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);padding:4px 0}
.cal-cell{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
.cal-cell.blank{background:none;border:none;cursor:default}
.cal-cell b{font-size:14px;font-weight:700}
.cal-cell .dot{width:5px;height:5px;border-radius:99px;background:var(--orange)}
.cal-cell.today{border-color:var(--orange2)}
.cal-cell.today b{color:var(--orange2)}
.cal-cell.sel{background:var(--orange);border-color:var(--orange)}
.cal-cell.sel b{color:#140A02}
.cal-cell.sel .dot{background:#140A02}

/* den – sloty */
.day-sum{display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.day-sum b{font-family:'Archivo Expanded','Archivo',sans-serif;font-size:17px}
.day-kcal{font-size:13px;font-weight:700;color:var(--orange2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.mpd-toggle{display:flex;gap:6px;padding:0 18px;margin-bottom:12px;align-items:center}
.mpd-toggle span{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 18px 10px;display:flex;align-items:center;gap:12px}
.slot-lab{flex:0 0 80px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--orange)}
.slot-body{flex:1;cursor:pointer;min-width:0}
.slot-body .s-name{font-size:15px;font-weight:600;line-height:1.3}
.slot-body .s-kcal{font-size:12px;color:var(--muted);margin-top:2px}
.slot-body.empty .s-name{color:var(--muted);font-weight:500}
.slot-act{flex:0 0 auto;display:flex;gap:6px}
.slot-act button{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:16px;cursor:pointer}
.dup-bar{display:flex;gap:8px;padding:4px 18px 0}
.dup-bar button{flex:1;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}

/* ===== MODAL ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.m-sheet{background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.m-title{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:900;font-size:19px;margin-bottom:14px}
.m-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.m-item .emoji{font-size:22px}
.m-item span{flex:1;font-size:15px;font-weight:600}
.m-item small{color:var(--orange2);font-weight:700}
.m-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.m-cell{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer}
.m-cell.blank{background:none;border:none;cursor:default}
.m-cell.src{opacity:.3;cursor:default;border-style:dashed}
.m-cell.on{background:var(--orange);border-color:var(--orange);color:#140A02}

/* ===== POLOŽKY VE SLOTU ===== */
.slot{align-items:flex-start}
.slot-lab{padding-top:10px}
.entry{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.entry .e-body{flex:1;min-width:0;cursor:pointer}
.entry .e-name{font-size:14px;font-weight:600;line-height:1.25}
.entry .e-kcal{font-size:11px;color:var(--muted);margin-top:1px}
.entry .e-x{width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:14px;flex:0 0 auto}
.slot-add{background:none;border:1px dashed var(--line);border-radius:10px;color:var(--muted);width:100%;padding:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}

/* ===== POROVNÁNÍ S CÍLI ===== */
.cmp{margin:0 18px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cmp-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cmp-row:last-child{margin-bottom:0}
.cmp-lab{flex:0 0 50px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.cmp-bar{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.cmp-bar i{display:block;height:100%;border-radius:99px}
.cmp-val{flex:0 0 auto;font-size:12px;font-weight:700;white-space:nowrap}
.tgt-day{font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.tgt-day b{color:var(--orange)}
.tgt-day .e-x{margin-left:auto;width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:14px}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--orange);color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90%;text-align:center}

/* ===== SNĚZENO / ZÁSOBY ===== */
.entry .e-eat{width:30px;height:30px;border-radius:9px;background:var(--card);border:2px solid var(--line);color:#140A02;cursor:pointer;font-size:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.entry.eaten{opacity:.75}
.entry.eaten .e-eat{background:var(--green);border-color:var(--green)}
.entry.eaten .e-name{text-decoration:line-through;color:var(--muted)}
.sub-tabs{display:flex;gap:8px;padding:0 18px 14px}
.sub-tabs .chip{flex:1;text-align:center}
.stock-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.stock-item .s-name{flex:1;font-size:15px;font-weight:600;min-width:0}
.stock-item input{width:74px;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--orange2);font-family:inherit;font-size:15px;font-weight:700;padding:7px;text-align:center}
.stock-item .s-unit{flex:0 0 auto;font-size:13px;color:var(--muted);font-weight:600;min-width:34px}
.stock-item .e-x{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:14px;flex:0 0 auto}
.stock-item .s-adj{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--orange);cursor:pointer;font-size:16px;font-weight:700;flex:0 0 auto}
.stock-item.zero{opacity:.55;border-style:dashed}
.stock-item.zero .s-name{color:var(--muted)}
.stock-item.zero input{color:#E05B5B}
.stock-item .s-buy{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--ember);color:var(--orange2);cursor:pointer;font-size:14px;flex:0 0 auto}
.stock-cat{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.stock-cat::after{content:'';flex:1;height:1px;background:var(--line)}
.stock-cat small{color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none}

/* ===== PŘEPOČET VAH ===== */
.calc-hero{margin:0 18px 16px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.calc-hero .ratio{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:900;font-size:38px;color:var(--orange)}
.calc-hero .ratio small{font-size:15px;color:var(--muted);font-weight:600;display:block;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.calc-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.calc-row input.p-lab{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:inherit;font-size:14px;padding:8px}
.calc-row input.p-raw{flex:0 0 78px;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--orange2);font-family:inherit;font-size:15px;font-weight:700;padding:8px;text-align:center}
.calc-row .unit{flex:0 0 auto;font-size:12px;color:var(--muted);font-weight:700}
.calc-row .e-x{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:14px;flex:0 0 auto}

/* ================== DATA ================== */
let S = load();
function load(){
  let d={};
  try{ d = JSON.parse(localStorage.getItem('opchef')||'{}'); }catch(e){}
  const s = {
    recipes: d.recipes||[],
    fav: d.fav||[],
    notes: d.notes||{},
    shop: d.shop||[],
    stock: d.stock||[],   // skladové zásoby: [{n, mn, j}]
    calc: d.calc|| {items:[{lab:'Trénink Po',raw:100},{lab:'Trénink St',raw:100},{lab:'Volno Út',raw:90}], cooked:'', tare:''},
    porce: d.porce||{},
    ingDone: d.ingDone||{},
    defaultMpd: d.defaultMpd|| (d.plan&&d.plan.mpd) || 4,
    targets: d.targets||{},   // cíle podle dne v týdnu 0=Po..6=Ne: {kcal,b,s,t}
    // days['YYYY-MM-DD'] = {mpd:4, meals:[[polozky],...]}
    days: (d.days && !Array.isArray(d.days)) ? d.days : {}
  };
  // starý týdenní plán (v2) nemá datumy – vynecháme
  if(d.days && Object.keys(s.days).some(k=>!/^\d{4}-\d{2}-\d{2}$/.test(k))) s.days={};
  // domerguj výchozí recepty, které chybí, a aktualizuj ty s novější verzí
  DEFAULT_RECIPES.forEach(dr=>{
    const idx=s.recipes.findIndex(r=>r.id===dr.id);
    if(idx<0) s.recipes.push(dr);
    else if((dr.ver||0)>(s.recipes[idx].ver||0)) s.recipes[idx]=dr;
  });
  if(!s.recipes.length) s.recipes=[...DEFAULT_RECIPES];
  return s;
}
function save(){ localStorage.setItem('opchef', JSON.stringify(S)); }

let view='home', currentId=null, currentCat='Vše', backTo='home';

let cal={y:_now.getFullYear(), m:_now.getMonth()};
let selDate=dkey(_now.getFullYear(),_now.getMonth(),_now.getDate());
const app=document.getElementById('app');

function dkey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return {y,m:m-1,d}; }
function fmtDate(k){ const p=parseKey(k); const wd=new Date(p.y,p.m,p.d).getDay(); return `${DAYS_S[wd===0?6:wd-1]} ${p.d}. ${p.m+1}.`; }

/* položka ve slotu: {typ:'r',id} = recept | {typ:'q',n,kcal,b,s,t} = rychlá položka */
function normSlot(sl){
  if(!sl) return [];
  if(Array.isArray(sl)) return sl.filter(Boolean);
  if(typeof sl==='string') return [{typ:'r',id:sl}];   // migrace ze starší verze
  return [sl];
}
/* čtení dne (bez zápisu) */
function readDay(k){
  const d=S.days[k];
  const mpd=d?d.mpd:S.defaultMpd;
  let meals=d?d.meals.map(normSlot):[];
  while(meals.length<mpd) meals.push([]);
  return {mpd, meals:meals.slice(0,mpd)};
}
/* zápis dne */
function writeDay(k,obj){
  if(obj.meals.every(sl=>!sl.length) && obj.mpd===S.defaultMpd) delete S.days[k];
  else S.days[k]=obj;
  save();
}
function entryMacros(e){
  if(e.typ==='q') return {kcal:+e.kcal||0,b:+e.b||0,s:+e.s||0,t:+e.t||0};
  const r=S.recipes.find(x=>x.id===e.id);
  return r?r.makra:{kcal:0,b:0,s:0,t:0};
}
function entryName(e){
  if(e.typ==='q') return e.n;
  const r=S.recipes.find(x=>x.id===e.id);
  return r?(r.emoji?r.emoji+' ':'')+r.nazev:'(smazaný recept)';
}
function daySums(k){
  const o={kcal:0,b:0,s:0,t:0};
  readDay(k).meals.forEach(sl=>sl.forEach(e=>{
    const m=entryMacros(e);
    o.kcal+=m.kcal;o.b+=m.b;o.s+=m.s;o.t+=m.t;
  }));
  return o;
}
function dayKcal(k){ return Math.round(daySums(k).kcal); }
function hasMeals(k){ return readDay(k).meals.some(sl=>sl.length); }
function wdOf(k){ const p=parseKey(k); const w=new Date(p.y,p.m,p.d).getDay(); return w===0?6:w-1; }
/* ---- skladové zásoby ---- */
/* Normalizace: malá písmena, bez diakritiky, bez závorek → pak slovník aliasů.
   Díky tomu se „Kuřecí prsa", „kuřecí prsní řízky" i „Kuřecí prso" počítají jako JEDNA položka. */
const ING_ALIASES={
  'kureci prsni rizky':'kureci prsa','kureci prso':'kureci prsa','kureci rizky':'kureci prsa','prsni rizky':'kureci prsa','kure prsa':'kureci prsa',
  'cornflakes':'kukuricne lupinky','kukuricne vlocky':'kukuricne lupinky',
  'bezlaktozovy jogurt':'bezlaktozovy bily jogurt','bily jogurt bezlaktozovy':'bezlaktozovy bily jogurt','jogurt bezlaktozovy':'bezlaktozovy bily jogurt',
  'jasminova ryze':'ryze','basmati ryze':'ryze','jasminova / basmati ryze':'ryze','ryze jasminova':'ryze','ryze basmati':'ryze',
  'mlete hovezi':'mlete hovezi maso','mlety hovezi krk':'mlete hovezi maso','hovezi mlete':'mlete hovezi maso','mlete hovezi krk':'mlete hovezi maso',
  'losos filet':'losos','cerstvy losos':'losos','losos s kuzi':'losos','losos bez kuze':'losos',
  'zelena nat jarni cibulky':'jarni cibulka','zelena cast jarni cibulky':'jarni cibulka','jarni cibulka zelena nat':'jarni cibulka',
  'pazitka nebo jarni cibulka':'jarni cibulka',
  'bezlepkovy chleba':'bezlepkovy chleb','bezlepkovy chleb lidl':'bezlepkovy chleb','chleb bezlepkovy':'bezlepkovy chleb',
  'vajicka':'vejce','vejce m':'vejce','vejce l':'vejce',
  'brambory varny typ c':'brambory','brambory agria':'brambory',
  'sojova omacka':'sojova omacka','kikkoman':'sojova omacka','sojova omacka kikkoman':'sojova omacka',
  'kokosove mleko plechovka':'kokosove mleko','olivovy olej':'olej','olivovy / cesnekovy olej':'olej',
  'passata':'rajcatova passata','rajcatovy protlak':'rajcatova passata','tortilla':'kukuricne tortilly','kukuricna tortilla':'kukuricne tortilly','tortilly':'kukuricne tortilly',
  'cedar':'cedar','cedar platek':'cedar','cedar strouhany':'cedar','strouhany cedar':'cedar',
  'zakysana smetana':'bezlaktozova zakysana smetana','zakysana smetana bezlaktozova':'bezlaktozova zakysana smetana','bezlaktozova zakysana':'bezlaktozova zakysana smetana',
  'cedar varianta 1':'cedar','bezlaktozova zakysana smetana varianta 2':'bezlaktozova zakysana smetana',
  'tvaruzky':'olomoucke tvaruzky','syrecky':'olomoucke tvaruzky','olomoucke syrecky':'olomoucke tvaruzky',
  'bilek':'vajecny bilek','vajecne bilky':'vajecny bilek','bilky':'vajecny bilek',
  'hladka mouka':'mouka','bezlepkova smes':'mouka','hladka mouka nebo bezlepkova smes':'mouka','bezlepkova mouka':'mouka'
};
function normName(n){
  let s=(n||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // odstranit diakritiku
    .replace(/\(.*?\)/g,' ')                            // odstranit závorky
    .replace(/[^a-z0-9 /]/g,' ')
    .replace(/\s+/g,' ').trim();
  return ING_ALIASES[s]||s;
}
function normUnit(j){
  let s=(j||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  if(/^lzic(e|ka|ky|ek)?$/.test(s)) return s.startsWith('lzick')?'lzicka':'lzice';
  if(s==='krajic'||s==='krajice') return 'krajic';
  if(s==='kus'||s==='kusy'||s==='ks') return 'ks';
  return s;
}
function skey(n,j){ return normName(n)+'|'+normUnit(j); }
function findStock(n,j){ return S.stock.find(s=>skey(s.n,s.j)===skey(n,j)); }
function addStock(n,j,mn){
  const st=findStock(n,j);
  if(st) st.mn=Math.round((st.mn+mn)*100)/100;
  else S.stock.push({n:n.trim(),mn:Math.round(mn*100)/100,j:(j||'').trim()});
}

  if(from) backTo=from; else if(v==='detail') backTo='home';
  stopAllTimers();
  render();
  window.scrollTo(0,0);
}
function render(){
  ['home','plan','shop','calc','add','data'].forEach(n=>{
    const b=document.getElementById('nav-'+n);
    if(b) b.classList.toggle('on', view===n || (view==='detail'&&n===backTo));

  updateBadge();
  if(view==='home') rHome();
  else if(view==='detail') rDetail();
  else if(view==='plan') rPlan();
  else if(view==='shop') rShop();

}

/* ================== ČASOVAČE ================== */
let timers={};
function fmtT(s){
  const m=Math.floor(s/60),sec=s%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(t=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;o.type='sine';
      g.gain.setValueAtTime(0.001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.4,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.3);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.32);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([300,150,300]);
}
function stopAllTimers(){
  Object.values(timers).forEach(t=>clearInterval(t.iv));
  timers={};
}
function getMiniDur(idx){
  const r=S.recipes.find(x=>x.id===currentId);
  return miniDur[idx]!==undefined ? miniDur[idx] : r.kroky[idx].timer;
}
function miniAdj(idx,d){
  const key='mini'+idx;
  const el=document.getElementById('kt-'+idx);
  if(timers[key]){
    timers[key].left=Math.max(0,timers[key].left+d);
    el.innerHTML='⏸ '+fmtT(timers[key].left);
  }else{
    miniDur[idx]=Math.max(60,getMiniDur(idx)+d);
    el.innerHTML='⏱ '+fmtT(miniDur[idx]);
  }
}
function miniTimer(idx){
  const key='mini'+idx;
  const el=document.getElementById('kt-'+idx);
  if(timers[key]){
    clearInterval(timers[key].iv); delete timers[key];
    el.classList.remove('run'); el.innerHTML='⏱ '+fmtT(getMiniDur(idx));
    return;
  }
  const dur=getMiniDur(idx);
  el.classList.add('run'); el.innerHTML='⏸ '+fmtT(dur);
  timers[key]={left:dur,iv:setInterval(()=>{
    timers[key].left--;
    if(timers[key].left<=0){
      clearInterval(timers[key].iv); delete timers[key];
      el.classList.remove('run'); el.innerHTML='✓ Hotovo!';
      beep();
    } else el.innerHTML='⏸ '+fmtT(timers[key].left);
  },1000)};
}

/* ================== COOKING MODE ================== */
const cookEl=document.getElementById('cook');
let cook={r:null,step:0,left:0,dur:0,run:false,iv:null,wl:null};
async function startCook(id){
  cook.r=S.recipes.find(x=>x.id===id);
  cook.step=0;
  cookEl.classList.add('on');
  try{ cook.wl=await navigator.wakeLock?.request('screen'); }catch(e){}
  rCook();
}
function endCook(){
  clearInterval(cook.iv); cook.iv=null; cook.run=false;
  cook.wl?.release?.(); cook.wl=null;
  cookEl.classList.remove('on');
}
const RING=2*Math.PI*83;
function rCook(){
  const r=cook.r,i=cook.step,k=r.kroky[i],total=r.kroky.length;
  clearInterval(cook.iv); cook.iv=null; cook.run=false;
  cook.dur=k.timer||0; cook.left=cook.dur;
  cookEl.innerHTML=`
    <div class="c-top">
      <span class="c-prog">KROK ${i+1} / ${total}</span>
      <button class="c-close" onclick="endCook()">✕ Konec</button>
    </div>
    <div class="c-bar"><i style="width:${((i+1)/total)*100}%"></i></div>
    <div class="c-mid">
      ${k.nazev?`<div class="c-title">${esc(k.nazev)}</div>`:''}
      <div class="c-text">${esc(k.text)}</div>
      ${k.timer?`
      <div class="c-ring-wrap">
        <div class="c-ring" id="ring">
          <svg width="185" height="185">
            <circle cx="92.5" cy="92.5" r="83" fill="none" stroke="#241E19" stroke-width="10"/>
            <circle id="ring-c" cx="92.5" cy="92.5" r="83" fill="none" stroke="#FF6B1A" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="${RING}" stroke-dashoffset="0"/>
          </svg>
          <div class="t-num"><b id="t-num">${fmtT(cook.dur)}</b><small id="t-lab">připraveno</small></div>
        </div>
        <div class="t-adj-row">
          <button class="t-adj" onclick="cookAdj(-60)">−1 min</button>
          <button class="t-adj" onclick="cookAdj(60)">＋1 min</button>
        </div>
        <div class="t-btns">
          <button class="t-btn start" id="t-start" onclick="cookTimer()">▶ Spustit</button>
          <button class="t-btn reset" onclick="rCook()">↺ Reset</button>
        </div>
      </div>`:''}
    </div>
    <div class="c-nav">
      ${i>0?`<button class="c-prev" onclick="cookStep(-1)">← Zpět</button>`:''}
      ${i<total-1
        ?`<button class="c-next" onclick="cookStep(1)">Další krok →</button>`
        :`<button class="c-next" onclick="endCook()">✓ Dobrou chuť!</button>`}
    </div>`;
}
function cookStep(d){ cook.step+=d; rCook(); }
function cookAdj(d){
  const n=document.getElementById('t-num'),c=document.getElementById('ring-c');
  if(cook.run){
    cook.left=Math.max(0,cook.left+d);
    cook.dur=Math.max(cook.left,cook.dur+d);
  }else{
    cook.dur=Math.max(60,cook.dur+d);
    cook.left=cook.dur;
  }
  n.textContent=fmtT(cook.left);
  c.style.strokeDashoffset=RING*(1-(cook.dur?cook.left/cook.dur:0));
}
function cookTimer(){
  const btn=document.getElementById('t-start');
  if(cook.run){
    clearInterval(cook.iv); cook.iv=null; cook.run=false;
    btn.textContent='▶ Pokračovat';
    document.getElementById('t-lab').textContent='pauza';
    return;
  }
  cook.run=true;
  btn.textContent='⏸ Pauza';
  document.getElementById('t-lab').textContent='běží';
  cook.iv=setInterval(()=>{
    cook.left--;
    const n=document.getElementById('t-num'),c=document.getElementById('ring-c');
    if(!n){clearInterval(cook.iv);return;}
    n.textContent=fmtT(Math.max(0,cook.left));
    c.style.strokeDashoffset=RING*(1-cook.left/cook.dur);
    if(cook.left<=0){
      clearInterval(cook.iv);cook.iv=null;cook.run=false;
      n.textContent='✓';
      document.getElementById('t-lab').textContent='hotovo';
      document.getElementById('ring').classList.add('done');
      c.style.stroke='#6BC46B';
      btn.style.display='none';
      beep();
    }
  },1000);
}

function cmpHTML(sums,tgt){
  const rows=[
    ['kcal',Math.round(sums.kcal),+tgt.kcal,''],
    ['Bílk.',Math.round(sums.b),+tgt.b,'g'],
    ['Sach.',Math.round(sums.s),+tgt.s,'g'],
    ['Tuky',Math.round(sums.t),+tgt.t,'g']
  ];
  return `<div class="cmp">${rows.map(([lab,val,goal,u])=>{
    if(!goal) return '';
    const pct=Math.min(100,val/goal*100);
    const ratio=val/goal;
    const color = ratio>1.1 ? '#E05B5B' : (ratio>=0.9 ? 'var(--green)' : 'var(--orange)');
    const diff=val-goal;
    return `<div class="cmp-row">
      <div class="cmp-lab">${lab}</div>
      <div class="cmp-bar"><i style="width:${pct}%;background:${color}"></i></div>
      <div class="cmp-val" style="color:${color}">${val} / ${goal}${u} <span style="color:var(--muted)">(${diff>0?'+':''}${diff}${u})</span></div>
    </div>`;
  }).join('')}</div>`;
}

function setDayMpd(n){
  const day=readDay(selDate);
  if(n===day.mpd)return;
  let meals=day.meals.map(sl=>[...sl]);
  if(n===5) meals.splice(3,0,[]);
  else{
    const rem=meals.splice(3,1)[0];
    if(rem.length) meals[3]=[...meals[3],...rem];   // jídla ze svačiny 2 přesuň do večeře
    meals=meals.slice(0,4);
  }
  writeDay(selDate,{mpd:n,meals});
  render();
}
function addEntry(i,entry,replaceIdx){
  const day=readDay(selDate);
  if(replaceIdx!==undefined && replaceIdx!==null) day.meals[i][replaceIdx]=entry;
  else day.meals[i].push(entry);
  writeDay(selDate,day);
  render();
}
function removeEntry(i,j){
  const day=readDay(selDate);
  const e=day.meals[i][j];
  if(e&&e.eaten&&e.ded) e.ded.forEach(d=>addStock(d.n,d.j,d.mn)); // vrátit zásoby, pokud bylo snězené
  day.meals[i].splice(j,1);
  writeDay(selDate,day);
  render();
}
function toggleEaten(i,j){
  const day=readDay(selDate);
  const e=day.meals[i][j];
  if(!e.eaten){
    const ded=[];
    if(e.typ==='r'){
      const r=S.recipes.find(x=>x.id===e.id);
      if(r) r.ingredience.forEach(ing=>{
        if(!ing.mn) return;
        const st=findStock(ing.n,ing.j);
        if(st&&st.mn>0){
          const take=Math.min(st.mn,ing.mn);
          st.mn=Math.round((st.mn-take)*100)/100;
          ded.push({n:ing.n,j:ing.j,mn:take});
        }
      });
    }
    e.eaten=true;
    if(ded.length){ e.ded=ded; toast('Snězeno ✓ – odepsáno ze zásob'); }
    else if(e.typ==='r'){ toast('Snězeno ✓ (v zásobách nebylo co odepsat)'); }
    else toast('Snězeno ✓');
  }else{
    (e.ded||[]).forEach(d=>addStock(d.n,d.j,d.mn));
    delete e.eaten; delete e.ded;
    toast('Vráceno – zásoby obnoveny');
  }
  writeDay(selDate,day);
  render();
}

function autoCat(n){
  const s=normName(n);
  if(/(kureci|hovezi|veprov|losos|ryb|maso|krut|sunk|tunak|krevet)/.test(s)) return STOCK_CATS[0];
  if(/(jogurt|syr|cedar|mleko|tvaroh|maslo|ghi|smetan|mozzarel|skyr|vejce|bilek|tvaruzk)/.test(s)) return STOCK_CATS[1];
  if(/(ryze|brambor|testovin|hranolk|chleb|bulk|pecivo|oves|lupink|quinoa|mouk|chlebick|tortill)/.test(s)) return STOCK_CATS[2];
  if(/(banan|jablk|citron|limet|zelenin|salat|okurk|mrkev|rajc|cibul|petrzel|koriandr|bylink|avokad|jahod|ovoce|mrazen|cuket|paprika)/.test(s)) return STOCK_CATS[3];
  if(/(sul|pepr|kmin|kurkum|zazvor|uzena paprika|koreni|omack|sojov|ocet|olej|sirup|kecup|tymian|chilli|susene|oregano|passat)/.test(s)) return STOCK_CATS[4];
  return STOCK_CATS[5];
}

function shopToggle(i){ S.shop[i].done=!S.shop[i].done; save(); render(); }

function boughtToStock(){
  const bought=S.shop.filter(s=>s.done);
  bought.forEach(s=>{
    addStock(s.n,s.j,s.mn||0);
    const st=findStock(s.n,s.j);
    if(st&&!st.kat) st.kat=autoCat(s.n);
  });

  render();

function stockAdj(i,dir){
  const s=S.stock[i];
  s.mn=Math.max(0,Math.round((s.mn+dir*stockStep(s.j))*100)/100);
  save(); render();
}
function stockSet(i,v){
  S.stock[i].mn=Math.max(0,+v||0);
  save(); render();
}
function stockDel(i){
  askConfirm('Smazat „'+S.stock[i].n+'" ze zásob? (Pokud jen došla, nech ji zešedlou na nule – připomene ti nákup.)',()=>{

function stockToShop(i){
  const s=S.stock[i];
  const ex=S.shop.find(x=>skey(x.n,x.j)===skey(s.n,s.j)&&!x.done);
  if(!ex) S.shop.push({n:s.n,mn:0,j:s.j,done:false});
  save(); updateBadge();
  toast('„'+s.n+'" přidáno do nákupního seznamu 🛒');
}
function stockAdd(){
  if(!stVals.n.trim()){ toast('Vyplň název položky'); return; }
  const st=findStock(stVals.n,stVals.j);
  addStock(stVals.n,stVals.j,+stVals.mn||0);
  const added=findStock(stVals.n,stVals.j);
  if(added) added.kat=stVals.kat||autoCat(stVals.n);
  save();
  stVals={n:'',mn:'',j:'g',kat:''};
  toast('Přidáno do zásob ✓');
  render();
}

/* ================== PŘEPOČET VAH ================== */
function calcResults(){
  const c=S.calc;
  const raws=c.items.map(i=>+i.raw||0);
  const sumRaw=raws.reduce((a,b)=>a+b,0);
  const net=Math.max(0,(+c.cooked||0)-(+c.tare||0));
  if(!sumRaw||!net) return null;
  const ratio=net/sumRaw;
  // rozdělení s korekcí zaokrouhlení – součet porcí přesně odpovídá navážené váze
  let out=raws.map(r=>Math.round(r*ratio));
  const diff=Math.round(net)-out.reduce((a,b)=>a+b,0);
  if(out.length) out[out.length-1]+=diff;
  return {ratio,sumRaw,net,out};
}
function calcHeroHTML(){
  const r=calcResults();
  if(!r) return '';
  return `<div class="calc-hero">
    <div class="ratio">${r.ratio.toFixed(2)}×<small>nabytí objemu</small></div>
    <div class="calc-note" style="margin-top:6px">${r.sumRaw} g syrové → ${Math.round(r.net)} g uvařené</div>
  </div>`;
}
function calcOutHTML(){
  const c=S.calc, r=calcResults();

    </div>

      Pár gramů rozdílu je normální – něco se přichytí na hrnci.</p>`;
}

function saveRecipe(){

  const data={
    nazev:fMeta.nazev.trim(),
    emoji:fMeta.emoji||'🍽️',

    kroky:fKroky.filter(k=>k.text.trim()).map(k=>{
      const o={nazev:k.nazev.trim(),text:k.text.trim()};
      if(+k.timer>0) o.timer=Math.round(+k.timer*60);
      return o;
    })
  };
  if(editId){
    const r=S.recipes.find(x=>x.id===editId);
    Object.assign(r,data);
    const id=editId; editId=null;
    save(); go('detail',id);
  }else{
    const r={id:'r'+Date.now(),...data};
    S.recipes.push(r); save();
    go('detail',r.id);
  }
}

/* ================== NASTAVENÍ ================== */
function rData(){
  app.innerHTML=`
  <div style="padding-top:22px">
  <h2 class="page">⚙️ Nastavení</h2>
  <div class="pad">
    <div class="sec-title">Logo aplikace</div>
    <div style="display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px">
      <div style="width:64px;height:64px;flex:0 0 auto">${LOGO_SVG}</div>
      <div>
        <div class="logo" style="font-size:22px">OP<span>Chef</span></div>
        <p style="color:var(--muted);font-size:13px;line-height:1.4;margin-top:4px">
          Vidlička v ohni. Při nasazení na GitHub Pages z ní uděláme ikonu na plochu telefonu.</p>
      </div>
    </div>
    <div class="sec-title">Záloha dat</div>
    <button class="btn primary" onclick="exportJSON()">⬇ Export zálohy (JSON)</button>
    <button class="btn ghost" onclick="document.getElementById('imp').click()">⬆ Import zálohy</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">
    <div class="sec-title">Statistiky</div>
    <div class="macros" style="grid-template-columns:repeat(4,1fr)">
      <div class="mbox"><b>${S.recipes.length}</b><small>receptů</small></div>
      <div class="mbox"><b>${S.fav.length}</b><small>oblíb.</small></div>
      <div class="mbox"><b>${Object.keys(S.days).length}</b><small>dnů</small></div>
      <div class="mbox"><b>${S.stock.length}</b><small>zásob</small></div>
    </div>
  </div></div>`;
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='opchef-zaloha-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJSON(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.recipes) throw 0;
      localStorage.setItem('opchef', JSON.stringify(d));
      S=load(); save();
      toast('Záloha nahrána ✓'); go('home');
    }catch(e){toast('Soubor se nepodařilo načíst – není to platná záloha OPChef.');}
  };
  rd.readAsText(f);
}

render();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
